<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YugeSavers - Shop</title>
    <link href="css/vendor/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/icons.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="shop">
    <main class="app-shell">
      <header class="page-header pb-2">
        <p class="page-subtitle mb-1">Browse Groceries</p>
        <h1 class="page-title">Shop</h1>
      </header>

      <section class="utility-row px-3 pt-1 pb-2">
        <span class="utility-chip subtle"><i class="bi bi-geo-alt"></i> Colindale Superstore</span>
      </section>

      <section class="search-box px-3 pb-2">
        <div class="search-shell">
          <i class="bi bi-search"></i>
          <input type="text" class="search-input" placeholder="Search products and brands" />
        </div>
      </section>

      <section class="filter-scroll mb-2">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="meals">Meals</button>
        <button class="filter-btn" data-filter="fresh">Fresh</button>
        <button class="filter-btn" data-filter="dairy">Dairy</button>
        <button class="filter-btn" data-filter="bakery">Bakery</button>
        <button class="filter-btn" data-filter="frozen">Frozen</button>
        <button class="filter-btn" data-filter="household">Household</button>
        <button class="filter-btn" data-filter="baby">Baby</button>
        <button class="filter-btn" data-filter="drinks">Drinks</button>
      </section>

      <section class="px-3 pb-4">
        <div id="shopProducts" class="product-grid"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <ul class="nav nav-justified">
        <li class="nav-item">
          <a class="nav-link" data-page="home" href="index.html"><i class="bi bi-house"></i>Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-page="shop" href="shop.html"><i class="bi bi-shop-window"></i>Shop</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-page="offers" href="offers.html"><i class="bi bi-tag"></i>Offers</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-page="basket" href="basket.html"><i class="bi bi-basket2"></i>Basket</a>
        </li>
        <li class="nav-item">
          <a class="nav-link dead-link" data-page="account" href="#" aria-disabled="true"><i class="bi bi-person-circle"></i>Account</a>
        </li>
      </ul>
    </nav>

    <script src="data/meals.js"></script>
    <script src="data/products.js"></script>
    <script src="js/app.js"></script>
    <script src="js/shop.js"></script>
  </body>
</html>
