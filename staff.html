<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YugeSavers - Staff Portal</title>
    <link href="css/vendor/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/icons.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="profile">
    <main class="app-shell">
      <header class="page-header">
        <p class="page-subtitle mb-1">Operational View</p>
        <h1 class="page-title">Store Staff Portal</h1>
      </header>

      <section class="portal-box">
        <h2 class="h4 mb-2">Inventory Near Expiry</h2>
        <ul class="list-group list-group-flush">
          <li class="list-group-item d-flex justify-content-between px-0"><span>Chicken Breast</span><strong class="text-danger">Expires Tomorrow</strong></li>
          <li class="list-group-item d-flex justify-content-between px-0"><span>Bell Peppers</span><strong class="text-danger">Expires Tomorrow</strong></li>
          <li class="list-group-item d-flex justify-content-between px-0"><span>Spinach</span><strong class="text-danger">Expires Today</strong></li>
        </ul>
      </section>

      <section class="portal-box">
        <h2 class="h4 mb-2">Generated Bundle</h2>
        <p class="mb-0 fw-semibold">Chicken Fajita Night</p>
      </section>

      <section class="portal-box staff-actions d-grid gap-2 pb-4">
        <button class="btn btn-danger">Generate Bundle</button>
        <button class="btn btn-outline-dark">Print Recipe Poster</button>
        <button class="btn" style="background:#347477; color:#fff">Publish To App</button>
      </section>
    </main>

    <script src="data/meals.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
