<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YugeSavers - Recipes</title>
    <link href="css/vendor/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/icons.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="offers">
    <main class="app-shell">
      <header class="page-header">
        <p class="page-subtitle mb-1">Discounted Meal Bundles</p>
        <h1 class="page-title">Rescue Hub</h1>
      </header>

      <section class="hero-card mt-1">
        <p class="text-uppercase fw-bold small mb-1">How It Works</p>
        <h2 class="h4 mb-2">AI-generated recipes use near-expiry inventory and are published as discounted bundles.</h2>
        <div>
          <span class="expiry-chip"><i class="bi bi-clock-history"></i> Chicken expires tomorrow</span>
          <span class="expiry-chip"><i class="bi bi-clock-history"></i> Peppers expire tomorrow</span>
          <span class="expiry-chip"><i class="bi bi-exclamation-diamond"></i> Spinach expires today</span>
        </div>
      </section>

      <section class="filter-scroll mb-3">
        <button class="filter-btn active" data-filter="all">All Meals</button>
        <button class="filter-btn" data-filter="family">Family Meals</button>
        <button class="filter-btn" data-filter="quick">Quick Meals</button>
        <button class="filter-btn" data-filter="vegetarian">Vegetarian</button>
        <button class="filter-btn" data-filter="student">Student Meals</button>
      </section>

      <section class="px-3 pb-4">
        <div class="row g-0" id="recipesGrid"></div>
      </section>
    </main>

    <nav class="bottom-nav">
      <ul class="nav nav-justified">
        <li class="nav-item">
          <a class="nav-link" data-page="home" href="index.html"><i class="bi bi-house"></i>Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-page="shop" href="shop.html"><i class="bi bi-shop-window"></i>Shop</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-page="offers" href="offers.html"><i class="bi bi-tag"></i>Offers</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" data-page="basket" href="basket.html"><i class="bi bi-basket2"></i>Basket</a>
        </li>
        <li class="nav-item">
          <a class="nav-link dead-link" data-page="account" href="#" aria-disabled="true"><i class="bi bi-person-circle"></i>Account</a>
        </li>
      </ul>
    </nav>

    <script src="data/meals.js"></script>
    <script src="data/products.js"></script>
    <script src="js/app.js"></script>
    <script src="js/recipes.js"></script>
  </body>
</html>
